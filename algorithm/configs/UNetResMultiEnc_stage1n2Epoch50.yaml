MODEL:
  NAME: "UNetResMultiEnc_PSPHEAD"
  # Teacher checkpoints for student training (MODE: 'ST') - uncomment and
  # point to the three teachers trained via INPUT.MODE FO / S2_missing /
  # S1_missing (each teacher run's val_max_miou.pth):
  # TEACHER_FULL: /path/to/teacher_fo.pth             # INPUT.MODE FO         (sees S2+S1+topo)
  # TEACHER_S1_TOPO: /path/to/teacher_s2_missing.pth  # INPUT.MODE S2_missing (sees S1+topo)
  # TEACHER_S2_TOPO: /path/to/teacher_s1_missing.pth  # INPUT.MODE S1_missing (sees S2+topo)
SOLVER:
  BATCH_SIZE: 8
MODE: 'normal'
INPUT:
  MODE: 'FO' # 'FO', 'S2_missing', 'S1_missing' (ignored under MODE ST)

# ----------------------------------------------------------------------------
# Dataset configuration
# Defaults live in core/configs/defaults.py and point to the authors' machine.
# Uncomment and edit the keys below for your own layout (partial overrides are
# fine - unset keys keep their defaults; yacs only accepts keys that already
# exist in the defaults). Each input sample is a 256x256, 10-channel stack
# [S2 x4, S1 x4, slope, aspect]; see README.md for details.
# ----------------------------------------------------------------------------
# DATASETS:
#   # Training: image folders and filename lists (4 parallel entries:
#   # supervised stage 1 + 3 unsupervised stage-2 subsets)
#   TRAIN_DIRS:
#     - /path/to/train_images
#     - /path/to/train_images
#     - /path/to/train_images
#     - /path/to/train_images
#   TRAIN_TXT_PATHS:
#     - /path/to/train_files_1.txt
#     - /path/to/train_files_2.txt
#     - /path/to/train_files_3.txt
#     - /path/to/train_files_4.txt
#   # Validation: image folder and filename list
#   VAL_DIRS:
#     - /path/to/val_images
#   VAL_TXT_PATHS:
#     - /path/to/val_files.txt
#   # Test: image folder and filename list
#   TEST_DIRS:
#     - /path/to/test_images
#   TEST_TXT_PATHS:
#     - /path/to/test_files.txt
#   # Urban-label rasters, shared by train / val / test
#   LABEL_DIR: /path/to/urban_labels
#   # Simulated cloud masks (evaluation uses MASK_10-90; the student
#   # augmentation uses MASK_20-80)
#   CLOUD_MASK_DIRS:
#     MASK_10: /path/to/cloud_masks_10
#     MASK_20: /path/to/cloud_masks_20
#     MASK_30: /path/to/cloud_masks_30
#     MASK_40: /path/to/cloud_masks_40
#     MASK_50: /path/to/cloud_masks_50
#     MASK_60: /path/to/cloud_masks_60
#     MASK_70: /path/to/cloud_masks_70
#     MASK_80: /path/to/cloud_masks_80
#     MASK_90: /path/to/cloud_masks_90
